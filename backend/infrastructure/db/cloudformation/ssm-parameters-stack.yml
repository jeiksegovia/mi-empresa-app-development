AWSTemplateFormatVersion: '2010-09-09'
Description: 'Mi Empresa Backend Infrastructure - SSM Parameters for Environment Configuration (sensitive secrets de-managed per F-02)'

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - prod
    Description: Environment name (staging or prod)

  ProjectName:
    Type: String
    Default: miempresa
    Description: Project name for parameter naming

  # Database Parameters
  DBHost:
    Type: String
    Default: localhost
    Description: Database host

  DBPort:
    Type: String
    Default: '5432'
    Description: Database port

  DBUser:
    Type: String
    Default: miempresa
    Description: Database user

  DBPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Database password (empty = placeholder; real value stored by create-instance.sh)

  # Application Parameters
  JWTExpiration:
    Type: String
    Default: 24h
    Description: JWT token expiration time

  JWTRefreshExpiration:
    Type: String
    Default: 7d
    Description: JWT refresh token expiration time

  CorsOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Allowed CORS origin

  Port:
    Type: String
    Default: '3001'
    Description: API server port

  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error
    Description: Application log level

  MaxFileSizeMB:
    Type: String
    Default: '100'
    Description: Maximum file upload size in MB

  # --------------------------------------------------------------------------
  # DE-MANAGED secrets (F-02 — see fix-contract §B).
  # JWT_SECRET, SESSION_SECRET, ORIGIN_VERIFY_SECRET are no longer created by
  # this template. They are owned via utilities/set-env.sh --secure instead,
  # which creates them as SecureString (this template CANNOT create SecureString).
  #
  # Migration order when applying this change to a live stack:
  #   1. FIRST deploy: add DeletionPolicy: Retain + UpdateReplacePolicy: Retain
  #      on the 3 resources (they are NOT in this file yet — see git history
  #      for the pre-de-management version). This step seeds the retain guard.
  #   2. THEN deploy: remove the 3 resources entirely. CFN drops them from the
  #      stack but the live SSM parameters are retained (step 1 set the policy).
  #   3. THEN run set-env.sh --stage <env> --secure for each of the 3 keys,
  #      passing the existing value into a shell variable (NEVER printing it).
  #      set-env.sh deletes the old String and recreates as SecureString in
  #      place; the value is unchanged.
  # --------------------------------------------------------------------------

  # Rate Limiting
  RateLimitWindowMs:
    Type: String
    Default: '900000'
    Description: Rate limit window in milliseconds (15 minutes)

  RateLimitMaxRequests:
    Type: String
    Default: '100'
    Description: Maximum requests per window

Conditions:
  AutoGenerateDBPassword: !Equals [!Ref DBPassword, '']

Resources:
  # ============================================================================
  # Database Configuration Parameters
  # ============================================================================
  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/db/DB_HOST'
      Type: String
      Value: !Ref DBHost
      Description: Database host

  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/db/DB_PORT'
      Type: String
      Value: !Ref DBPort
      Description: Database port

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/db/DB_NAME'
      Type: String
      Value: !Sub '${ProjectName}_${Environment}'
      Description: Database name

  DBUserParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/db/DB_USER'
      Type: String
      Value: !Ref DBUser
      Description: Database user

  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/db/DB_PASSWORD'
      Type: String
      Value: !If
        - AutoGenerateDBPassword
        - 'PLACEHOLDER_WILL_BE_SET_BY_INSTANCE'
        - !Ref DBPassword
      Description: Database password (placeholder, will be updated by instance)

  DatabaseURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/db/DATABASE_URL'
      Type: String
      Value: !Sub 'postgresql://${DBUser}:PLACEHOLDER@${DBHost}:${DBPort}/${ProjectName}_${Environment}'
      Description: PostgreSQL connection URL (will be updated with actual password)

  # ============================================================================
  # JWT Configuration Parameters
  # JWT_SECRET REMOVED — see fix-contract §B. Owned via set-env.sh --secure
  # as Type: SecureString. This template cannot manage SecureString values.
  # ============================================================================
  JWTExpirationParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/JWT_EXPIRATION'
      Type: String
      Value: !Ref JWTExpiration
      Description: JWT token expiration time

  JWTRefreshExpirationParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/JWT_REFRESH_EXPIRATION'
      Type: String
      Value: !Ref JWTRefreshExpiration
      Description: JWT refresh token expiration time

  # ============================================================================
  # Session Configuration Parameters
  # SESSION_SECRET REMOVED — see fix-contract §B. Owned via set-env.sh --secure
  # as Type: SecureString. ORIGIN_VERIFY_SECRET REMOVED for the same reason.
  # ============================================================================

  # ============================================================================
  # AWS Service Configuration Parameters
  # ============================================================================
  AWSRegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/AWS_REGION'
      Type: String
      Value: !Ref AWS::Region
      Description: AWS region

  AWSS3BucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/AWS_S3_BUCKET'
      Type: String
      Value: !Sub '${ProjectName}-uploads-${AWS::AccountId}-${Environment}'
      Description: S3 bucket for file uploads

  AWSS3BackupBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/AWS_S3_BACKUP_BUCKET'
      Type: String
      Value: !Sub '${ProjectName}-backups-${AWS::AccountId}-${Environment}'
      Description: S3 bucket for database backups

  # ============================================================================
  # Application Configuration Parameters
  # ============================================================================
  NodeEnvParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/NODE_ENV'
      Type: String
      # Always 'production' on deployed instances — the app gates dev behavior on
      # NODE_ENV !== 'production' (src/config/env.ts); STAGE differentiates tiers.
      Value: production
      Description: Node.js environment

  PortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/PORT'
      Type: String
      Value: !Ref Port
      Description: API server port

  APIVersionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/API_VERSION'
      Type: String
      Value: v1
      Description: API version prefix

  CorsOriginParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/CORS_ORIGIN'
      Type: String
      Value: !Ref CorsOrigin
      Description: Allowed CORS origin

  LogLevelParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/LOG_LEVEL'
      Type: String
      Value: !Ref LogLevel
      Description: Application log level

  LogFormatParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/LOG_FORMAT'
      Type: String
      Value: json
      Description: Log output format

  # ============================================================================
  # File Upload Configuration Parameters
  # ============================================================================
  MaxFileSizeMBParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/MAX_FILE_SIZE_MB'
      Type: String
      Value: !Ref MaxFileSizeMB
      Description: Maximum file upload size in MB

  AllowedFileTypesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/ALLOWED_FILE_TYPES'
      Type: String
      Value: image/jpeg,image/png,image/gif,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      Description: Allowed MIME types for file uploads

  # ============================================================================
  # Rate Limiting Configuration Parameters
  # ============================================================================
  RateLimitWindowMsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/RATE_LIMIT_WINDOW_MS'
      Type: String
      Value: !Ref RateLimitWindowMs
      Description: Rate limit window in milliseconds

  RateLimitMaxRequestsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/RATE_LIMIT_MAX_REQUESTS'
      Type: String
      Value: !Ref RateLimitMaxRequests
      Description: Maximum requests per window

  # ============================================================================
  # Email Configuration (Optional)
  # ============================================================================
  SMTPHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/SMTP_HOST'
      Type: String
      Value: smtp.gmail.com
      Description: SMTP server host

  SMTPPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/SMTP_PORT'
      Type: String
      Value: '587'
      Description: SMTP server port

  SMTPFromParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/api/SMTP_FROM'
      Type: String
      Value: noreply@miempresa.com
      Description: Default from email address

Outputs:
  ParameterPathPrefix:
    Description: SSM Parameter Store path prefix
    Value: !Sub '/${ProjectName}/${Environment}/'

  DatabaseURLParameterName:
    Description: Database URL parameter name
    Value: !Ref DatabaseURLParameter

  ParameterCount:
    Description: Number of parameters managed by this template (3 secrets de-managed)
    Value: '24'