AWSTemplateFormatVersion: '2010-09-09'
Description: 'Mi Empresa Frontend - Amplify Hosting (manual deploys, no Git) + artifacts bucket + SSM config'

# ============================================================================
# One stack per stage (mirrors the backend pattern). The Amplify app has NO
# repository — deployments are pushed by scripts/deploy-frontend.sh via
# `aws amplify start-deployment` from the artifacts bucket.
#
# The custom domain lives in Route 53 in this account, so Amplify creates the
# certificate-validation and alias records automatically.
# ============================================================================

Parameters:
  ProjectName:
    Type: String
    Default: miempresa

  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - prod

  RootDomain:
    Type: String
    Default: disruptiveexp.com

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # ============================================================================
  # Artifacts Bucket — frontend build zips.
  # ObjectOwnership: ObjectWriter ENABLES ACLs, which Amplify REQUIRES for
  # S3-sourced manual deploys (BucketOwnerEnforced buckets fail with
  # AccessControlList errors). Public ACL/policy access stays blocked at the
  # policy level; objects remain private.
  # ============================================================================
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-frontend-artifacts-${AWS::AccountId}-${Environment}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReleases
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # Amplify App — no Repository property = manual-deploy app
  # ============================================================================
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub '${ProjectName}-frontend-${Environment}'
      Platform: WEB
      # SPA fallback: any path without a static-asset extension serves index.html
      CustomRules:
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
          Target: /index.html
          Status: '200'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref Environment
      Stage: PRODUCTION
      EnableAutoBuild: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AmplifyDomain:
    Type: AWS::Amplify::Domain
    DependsOn: AmplifyBranch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      DomainName: !Ref RootDomain
      EnableAutoSubDomain: false
      SubDomainSettings:
        - Prefix: !If [IsProd, 'miempresa', 'miempresa-stg']
          BranchName: !Ref Environment

  # ============================================================================
  # SSM — per-stage frontend config (source of truth for build-time env vars)
  # ============================================================================
  ApiBaseParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/frontend/API_BASE'
      Type: String
      Value: !If
        - IsProd
        - !Sub 'https://${ProjectName}-api.${RootDomain}/api/v1'
        - !Sub 'https://${ProjectName}-api-stg.${RootDomain}/api/v1'
      Description: Backend API base URL baked into the static build (NUXT_PUBLIC_API_BASE)

  AppUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/frontend/APP_URL'
      Type: String
      Value: !If
        - IsProd
        - !Sub 'https://${ProjectName}.${RootDomain}'
        - !Sub 'https://${ProjectName}-stg.${RootDomain}'
      Description: Public URL of the deployed frontend (also the backend CORS origin)

Outputs:
  AmplifyAppId:
    Description: Amplify app ID (needed by deploy-frontend.sh)
    Value: !GetAtt AmplifyApp.AppId
    Export:
      Name: !Sub '${AWS::StackName}-AppId'

  BranchName:
    Description: Amplify branch receiving manual deployments
    Value: !Ref AmplifyBranch

  DefaultDomain:
    Description: Amplify default domain (works before DNS/cert propagation)
    Value: !Sub 'https://${Environment}.${AmplifyApp.DefaultDomain}'

  AppUrl:
    Description: Public frontend URL (custom domain)
    Value: !If
      - IsProd
      - !Sub 'https://${ProjectName}.${RootDomain}'
      - !Sub 'https://${ProjectName}-stg.${RootDomain}'

  ArtifactsBucketName:
    Description: Bucket for frontend build zips
    Value: !Ref ArtifactsBucket
